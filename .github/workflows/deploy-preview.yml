name: Deploy Preview

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      force_preview_deploy:
        description: 'Force preview deployment even when detect-changes is false'
        required: true
        default: true
        type: boolean
      pr_number:
        description: 'PR number used for deterministic preview alias naming'
        required: false
        type: string

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      has_migrations: ${{ steps.detect.outputs.has_migrations }}
      has_preview_deploy_changes: ${{ steps.detect.outputs.has_preview_deploy_changes }}
    steps:
      # Full history so paths-filter can resolve merge-base via local git
      # (detect-changes uses token: '' to avoid flaky GitHub API change listing).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Changes
        id: detect
        uses: ./.github/actions/detect-changes

  check-types:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm turbo run check-types --filter=web

  i18n-verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Verify i18n locale parity
        run: pnpm run verify:messages

  deploy-preview:
    needs: [detect-changes, check-types, i18n-verify]
    if: |
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.has_preview_deploy_changes == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_preview_deploy == true)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      NEON_DATABASE_USERNAME: ${{ secrets.DB_USER_NAME }}
      NEON_DATABASE_NAME: ${{ secrets.DB_NAME }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEFAULT_DB_URL: ${{ secrets.POSTGRES_URL }}
      PRIVATE_KEY: ${{ secrets.EVM_SC_OWNER_PRIVATE_KEY }}
      DEFAULT_DB_AUTHENTICATED_URL: ${{ secrets.POSTGRES_AUTHENTICATED_URL }}
      DEFAULT_DB_ANONYMOUS_URL: ${{ secrets.POSTGRES_ANONYMOUS_URL }}
      PR_OR_QUEUE_HEAD: ${{ github.event.pull_request.number || github.event.merge_group.head_sha || inputs.pr_number || github.run_id }}
      PREVIEW_ALIAS_SUFFIX: ${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Get branch name
        if: needs.detect-changes.outputs.has_migrations == 'true'
        id: branch-name
        uses: tj-actions/branch-names@v8

      # Reuse the PR preview Neon branch when it already exists. Do NOT delete it
      # up front: cancel-in-progress deploys left the live alias pointing at a
      # deleted DB (Privy session alive, /me 500 → profileUnavailable, Matrix down).
      - name: Create Neon Branch
        if: needs.detect-changes.outputs.has_migrations == 'true'
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent: main
          branch_name: preview/pr-${{ env.PR_OR_QUEUE_HEAD }}-${{ steps.branch-name.outputs.current_branch }}
          username: ${{ env.NEON_DATABASE_USERNAME }}
          database: ${{ env.NEON_DATABASE_NAME }}
          api_key: ${{ env.NEON_API_KEY }}

      - name: Update branch variables
        if: needs.detect-changes.outputs.has_migrations == 'true'
        run: |
          echo "BRANCH_DB_URL=${{ steps.create-branch.outputs.db_url_with_pooler }}" >> $GITHUB_ENV

      - name: Install Vercel CLI
        run: npm install --global vercel@48.0.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ env.VERCEL_TOKEN }}

      # Long-lived preview DBs can drift (renumbered migrations / partial applies)
      # and then drizzle migrate fails with 42P01. Only reset after a real failure.
      - name: Run Migrations
        id: migrate
        if: needs.detect-changes.outputs.has_migrations == 'true'
        continue-on-error: true
        env:
          BRANCH_DB_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}
        run: |
          vercel env pull --environment=preview --token=${{ env.VERCEL_TOKEN }}
          pnpm run migrate

      - name: Reset Neon Preview Branch after migrate failure
        id: reset-branch
        if: needs.detect-changes.outputs.has_migrations == 'true' && steps.migrate.outcome == 'failure'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: preview/pr-${{ env.PR_OR_QUEUE_HEAD }}-${{ steps.branch-name.outputs.current_branch }}
          api_key: ${{ env.NEON_API_KEY }}

      - name: Wait for Neon branch deletion
        if: needs.detect-changes.outputs.has_migrations == 'true' && steps.migrate.outcome == 'failure'
        run: sleep 8

      - name: Recreate Neon Branch after migrate failure
        id: recreate-branch
        if: needs.detect-changes.outputs.has_migrations == 'true' && steps.migrate.outcome == 'failure'
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent: main
          branch_name: preview/pr-${{ env.PR_OR_QUEUE_HEAD }}-${{ steps.branch-name.outputs.current_branch }}
          username: ${{ env.NEON_DATABASE_USERNAME }}
          database: ${{ env.NEON_DATABASE_NAME }}
          api_key: ${{ env.NEON_API_KEY }}

      - name: Update branch variables after recreate
        if: needs.detect-changes.outputs.has_migrations == 'true' && steps.migrate.outcome == 'failure'
        run: |
          echo "BRANCH_DB_URL=${{ steps.recreate-branch.outputs.db_url_with_pooler }}" >> $GITHUB_ENV

      - name: Retry Migrations after Neon reset
        id: migrate-retry
        if: needs.detect-changes.outputs.has_migrations == 'true' && steps.migrate.outcome == 'failure'
        env:
          BRANCH_DB_URL: ${{ steps.recreate-branch.outputs.db_url_with_pooler }}
        run: |
          vercel env pull --environment=preview --token=${{ env.VERCEL_TOKEN }}
          pnpm run migrate

      - name: Fail job when migrations did not apply
        if: needs.detect-changes.outputs.has_migrations == 'true' && steps.migrate.outcome == 'failure' && steps.migrate-retry.outcome != 'success'
        run: |
          echo "::error::Preview migrations failed even after resetting the Neon branch."
          exit 1

      # Prefer GITHUB_ENV BRANCH_DB_URL (updated after a migrate-failure recreate).
      # Do not pin create-branch.outputs here — that URL is dead after a reset.
      - name: Build Project Artifacts
        run: |
          # Next.js loads env from apps/web — root .env.local is not picked up by the web build.
          vercel env pull apps/web/.env.local --environment=preview --token=${{ env.VERCEL_TOKEN }}
          # vercel env pull can leave a stale BRANCH_DB_URL; force the URL from this run.
          if [ -n "${BRANCH_DB_URL:-}" ]; then
            grep -v '^BRANCH_DB_URL=' apps/web/.env.local > apps/web/.env.local.tmp || true
            mv apps/web/.env.local.tmp apps/web/.env.local
            echo "BRANCH_DB_URL=${BRANCH_DB_URL}" >> apps/web/.env.local
          fi
          # Build-time feature flags; enable on preview deploys for PR testing.
          echo "NEXT_PUBLIC_ENABLE_NETWORK_MAP=true" >> apps/web/.env.local
          echo "NEXT_PUBLIC_ENABLE_ONBOARDING_VOICE_REALTIME=true" >> apps/web/.env.local
          # App origin for links built server-side (notification push/email links, KYC return URL).
          # Must match the alias created in the "Alias" step below (pr-<suffix>.preview-app.hypha.earth),
          # otherwise those links fall back to the per-deployment *.vercel.app host (no session there).
          echo "NEXT_PUBLIC_APP_URL=https://pr-${PREVIEW_ALIAS_SUFFIX}.preview-app.hypha.earth" >> apps/web/.env.local
          vercel build --token=${{ env.VERCEL_TOKEN }}

      # Run after `vercel build`: Neon’s schema-diff API often returns HTTP 408 when
      # called seconds after migrations; the build buys ~minutes for the branch to settle.
      - name: Post Schema Diff Comment to PR
        id: schema_diff
        if: needs.detect-changes.outputs.has_migrations == 'true'
        continue-on-error: true
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          compare_branch: preview/pr-${{ env.PR_OR_QUEUE_HEAD }}-${{ steps.branch-name.outputs.current_branch }}
          base_branch: main
          database: ${{ env.NEON_DATABASE_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
          github-token: ${{ github.token }}

      - name: Log Neon schema diff failure
        if: always() && steps.schema_diff.outcome == 'failure'
        run: |
          echo "::warning::Neon schema-diff step failed (often HTTP 408). Preview deploy continues; re-run the workflow or check Neon status if you need the PR comment."

      - name: Deploy Preview to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ env.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # `vercel deploy` prints progress to stdout; a single-line `echo key=$(...)` into
          # GITHUB_OUTPUT breaks when the capture is multiline, leaving preview_url empty and
          # breaking `vercel alias`. Parse the deployment URL explicitly.
          export CI=1 FORCE_COLOR=0 NO_COLOR=1
          deploy_output=""
          for attempt in 1 2 3; do
            if deploy_output="$(
              vercel deploy --prebuilt --yes \
                --token="${VERCEL_TOKEN}" \
                --env "BRANCH_DB_URL=${BRANCH_DB_URL:-}" \
                2>&1
            )"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              printf '%s\n' "${deploy_output}"
              exit 1
            fi
            echo "vercel deploy failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          preview_url="$(
            set +o pipefail
            printf '%s\n' "${deploy_output}" \
              | grep -Eo 'https://[a-zA-Z0-9][a-zA-Z0-9.-]*\.vercel\.app' \
              | tail -n 1
          )"
          if [ -z "${preview_url}" ]; then
            echo '::error::Could not parse a *.vercel.app URL from vercel deploy output.'
            printf '%s\n' "${deploy_output}"
            exit 1
          fi
          echo "preview_url=${preview_url}" >> "${GITHUB_OUTPUT}"

      - name: Alias preview to deterministic PR domain
        id: alias
        env:
          VERCEL_TOKEN: ${{ env.VERCEL_TOKEN }}
          PREVIEW_ALIAS_SUFFIX: ${{ env.PREVIEW_ALIAS_SUFFIX }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          PREVIEW_ALIAS_DOMAIN="pr-${PREVIEW_ALIAS_SUFFIX}.preview-app.hypha.earth"
          vercel alias set "${PREVIEW_URL}" "${PREVIEW_ALIAS_DOMAIN}" --token="${VERCEL_TOKEN}"
          echo "preview_custom_url=https://${PREVIEW_ALIAS_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Comment custom preview URL on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PREVIEW_CUSTOM_URL: ${{ steps.alias.outputs.preview_custom_url }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const marker = '<!-- custom-preview-domain -->';
            const body = `${marker}
            🔗 Custom preview URL: ${process.env.PREVIEW_CUSTOM_URL}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  main:
    needs: [detect-changes]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      NEON_DATABASE_USERNAME: ${{ secrets.DB_USER_NAME }}
      NEON_DATABASE_NAME: ${{ secrets.DB_NAME }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEFAULT_DB_URL: ${{ secrets.POSTGRES_URL }}
      PRIVATE_KEY: ${{ secrets.EVM_SC_OWNER_PRIVATE_KEY }}
      DEFAULT_DB_AUTHENTICATED_URL: ${{ secrets.POSTGRES_AUTHENTICATED_URL }}
      DEFAULT_DB_ANONYMOUS_URL: ${{ secrets.POSTGRES_ANONYMOUS_URL }}
      PR_OR_QUEUE_HEAD: ${{ github.event.pull_request.number || github.event.merge_group.head_sha }}

    steps:
      - uses: actions/checkout@v4

      # Must run before format:check — if format fails, later steps are skipped but
      # Delete Neon Branch uses `if: always()` and needs this output for the branch name.
      - name: Get branch name
        if: needs.detect-changes.outputs.has_migrations == 'true'
        id: branch-name
        uses: tj-actions/branch-names@v8

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - name: Create Neon Branch
        if: needs.detect-changes.outputs.has_migrations == 'true'
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent: main
          branch_name: test/pr-${{ env.PR_OR_QUEUE_HEAD }}-${{ steps.branch-name.outputs.current_branch }}
          username: ${{ env.NEON_DATABASE_USERNAME }}
          database: ${{ env.NEON_DATABASE_NAME }}
          api_key: ${{ env.NEON_API_KEY }}

      - name: Update branch variables
        if: needs.detect-changes.outputs.has_migrations == 'true'
        run: |
          echo "BRANCH_DB_URL=${{ steps.create-branch.outputs.db_url_with_pooler }}" >> $GITHUB_ENV

      - name: Run Migrations
        if: needs.detect-changes.outputs.has_migrations == 'true'
        run: |
          echo "BRANCH_DB_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}" >> apps/web/.env.production
          pnpm run migrate

      - name: Delete Neon Branch
        if: always() && needs.detect-changes.outputs.has_migrations == 'true' && steps.create-branch.outcome == 'success'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: test/pr-${{ env.PR_OR_QUEUE_HEAD }}-${{ steps.branch-name.outputs.current_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
